[package]
name = "collatz-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"
